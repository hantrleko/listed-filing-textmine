name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" ruff
      - name: Ruff
        run: ruff check src tests app scripts --select E9,F63,F7,F82
      - name: Pytest
        run: pytest
